# Dependabot for mcp-http-tools. Alerts + security updates are repo settings
# (enabled separately); this file drives version updates, the labels that
# security PRs also inherit, and the grouping of both.
#
# Security updates are grouped per ecosystem: one security PR per ecosystem
# per run, instead of one PR per advisory.
#
# Only two ecosystems exist in this repo: npm (root package.json +
# pnpm-lock.yaml, pnpm version taken from packageManager via corepack) and
# github-actions. No Dockerfile, no compose, no Python/Go -- so no other entries.
#
# One Dependabot version-update PR at a time: the version updates of every
# ecosystem below join the single `dependencies` multi-ecosystem group (one
# weekly PR; open-pull-requests-limit: 1 on each entry), and semver-major
# version updates are ignored so one breaking major cannot block that PR;
# majors are bumped by hand. Security updates cannot join a multi-ecosystem
# group, so they stay grouped per ecosystem (`applies-to: security-updates`);
# open-pull-requests-limit and the major ignore do not apply to them.
#
# commit-message is a group-only option for a multi-ecosystem group, so it is
# set once below. Conventional commits drive semantic-release (.releaserc): a
# runtime dep bump ships as a fix release, a dev-only bump as chore.
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: Europe/Warsaw}
    commit-message: {prefix: fix, prefix-development: chore, include: scope}
updates:
  - package-ecosystem: npm
    directories: ["/"]
    cooldown:
      # 7 days = the workspace's pnpm minimumReleaseAge (10080 min). Version
      # updates only -- security updates ignore cooldown by design.
      default-days: 7
    open-pull-requests-limit: 1
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    ignore:
      # Majors are done by hand: one breaking major would hold up the single grouped PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, javascript]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    cooldown: {default-days: 7}
    open-pull-requests-limit: 1
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    ignore:
      # Majors are done by hand: one breaking major would hold up the single grouped PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, github_actions]
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

# Dependabot for mcp-http-tools. Alerts + security updates are repo settings
# (enabled separately); this file drives version updates, the labels that
# security PRs also inherit, and the grouping of both.
#
# Security updates are grouped per ecosystem: one security PR per ecosystem
# per run, instead of one PR per advisory.
#
# Only two ecosystems exist in this repo: npm (root package.json +
# pnpm-lock.yaml, pnpm version taken from packageManager via corepack) and
# github-actions. No Dockerfile, no compose, no Python/Go -- so no other entries.
#
# Grouping (3h4x, 2026-10-10): one grouped PR per ecosystem and directory, for
# version updates (<eco>-minor-patch) and for security updates (<eco>-security).
# This replaced `multi-ecosystem-groups` (2026-09-30 to 2026-10-10). While an entry
# belonged to a multi-ecosystem group, Dependabot ignored its `applies-to:
# security-updates` group and opened one PR per advisory, each conflicting with the
# others' lockfile; merging one made Dependabot open the next. Do not move back to
# multi-ecosystem-groups for that reason.
# The minor-patch groups have no update-types filter on purpose: a SHA-pinned action or
# a Docker digest is neither minor nor patch, and would get its own PR. Majors never reach
# them anyway: semver-major version updates stay ignored, so one breaking major cannot hold a
# grouped PR red; majors are bumped by hand. Security updates drop update-type
# ignores, so they still get majors when the fix needs one.
#
# commit-message is set on every entry below. Conventional commits drive semantic-release (.releaserc): a
# runtime dep bump ships as a fix release, a dev-only bump as chore.
version: 2
updates:
  - package-ecosystem: npm
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: Europe/Warsaw}
    open-pull-requests-limit: 1 # version PRs only; security PRs are not capped
    commit-message: {prefix: fix, prefix-development: chore, include: scope}
    directories: ["/"]
    cooldown:
      # 7 days = the workspace's pnpm minimumReleaseAge (10080 min). Version
      # updates only -- security updates ignore cooldown by design.
      default-days: 7
    ignore:
      # Majors are done by hand: one breaking major would hold up a grouped PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, javascript]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    schedule: {interval: weekly, day: monday, time: "06:00", timezone: Europe/Warsaw}
    open-pull-requests-limit: 1 # version PRs only; security PRs are not capped
    commit-message: {prefix: fix, prefix-development: chore, include: scope}
    directory: "/"
    cooldown: {default-days: 7}
    ignore:
      # Majors are done by hand: one breaking major would hold up a grouped PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies, github_actions]
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]

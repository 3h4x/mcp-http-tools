# mcp-http-tools — example configuration
# Copy to ~/.config/mcp-http-tools/config.yaml to override.
# Or run `node index.js --config /path/to/config.yaml` to use a different file.
# An explicit `--config` path is required and startup fails if it is missing
# or contains invalid YAML.
#
# Each tool maps to one HTTP request. Define as many as you need.
# Raw path placeholders like {+path} preserve "/" separators, but each
# segment must be non-empty and cannot be "." or "..". Params used by
# {+path} must be required or provide a safe non-empty default.

tools: []

# ── Examples ──────────────────────────────────────────────────────────────
#
# tools:
#   # GET with query params
#   - name: query_metrics
#     description: Run a PromQL instant query
#     method: GET
#     url: http://localhost:9090/api/v1/query
#     params:
#       - name: query
#         description: PromQL expression
#         required: true
#     response:
#       type: json
#       path: data.result
#
#   # GET with defaults
#   - name: search_logs
#     description: Search logs via LogQL
#     method: GET
#     url: http://localhost:3100/loki/api/v1/query_range
#     params:
#       - name: query
#         description: LogQL query
#         required: true
#       - name: limit
#         description: Max results
#         default: "50"
#     response:
#       type: json
#       path: data.result
#
#   # POST with JSON body
#   - name: create_silence
#     description: Create an Alertmanager silence
#     method: POST
#     url: http://localhost:9093/api/v2/silences
#     params:
#       - name: matchers
#         description: JSON array of matchers
#         required: true
#       - name: comment
#         description: Reason for silence
#         required: true
#     response:
#       type: json
#
#   # Simple health check (no params)
#   - name: ping_api
#     description: Check if the API is up
#     url: http://localhost:3000/health
#     response:
#       type: text
#
#   # Raw path placeholder for slash-separated keys
#   - name: get_job_file
#     description: Fetch a nested job asset by path
#     url: http://localhost:3000/jobs/{+path}
#     params:
#       - name: path
#         description: Slash-separated job path; segments cannot be empty, "." or ".."
#         required: true
#     response:
#       type: text
#
#   # Hyphenated placeholder names are supported
#   - name: get_user_report
#     description: Fetch a report for a user id
#     url: http://localhost:3000/users/{user-id}/reports/{+file-path}
#     params:
#       - name: user-id
#         description: User identifier
#         required: true
#       - name: file-path
#         description: Slash-separated report path
#         required: true
#     response:
#       type: text
#
#   # Auth via env var in headers
#   - name: list_alerts
#     description: List active alerts
#     url: http://localhost:9093/api/v2/alerts
#     headers:
#       Authorization: "Bearer ${ALERTMANAGER_TOKEN}"
#     response:
#       type: json
